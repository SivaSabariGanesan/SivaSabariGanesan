name: 3D Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate 3D Contribution Graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: SivaSabariGanesan

      - name: Move 3D Contribution Files to profile/3d-contrib
        run: |
          mkdir -p profile/3d-contrib
          if [ -d "profile-3d-contrib" ]; then
            cp -r profile-3d-contrib/* profile/3d-contrib/ || true
            rm -rf profile-3d-contrib
          fi

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/3d-contrib/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update 3d contribution graph"
            git push
          fi
