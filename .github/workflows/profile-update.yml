name: Profile Update

on:
  schedule:
    - cron: "0 0 * * 0" # Weekly on Sunday
  push:
    paths:
      - 'profile-content/**'
      - '.github/workflows/profile-update.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate SVGs
        run: |
          node .github/scripts/generate-hero-svg.js
          node .github/scripts/generate-tech-stack-svg.js
          node .github/scripts/generate-featured-work-svg.js

      - name: Update Currently Building Content
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/generate-currently-building.js

      - name: Render README.md
        run: node .github/scripts/render-readme.js

      - name: Commit and Push README.md if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md profile/currently-building.md profile/hero.svg profile/tech-stack.svg profile/featured-work.svg
          if git diff --cached --quiet; then
            echo "No changes to README.md or generated profile SVGs"
          else
            git commit -m "chore: auto-generate README.md from profile-content [skip ci]"
            git push
          fi
