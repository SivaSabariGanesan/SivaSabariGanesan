name: GitHub Streak Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-streak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create profile directory
        run: mkdir -p profile

      - name: Generate GitHub Streak Stats
        uses: be-next/github-streak-stats-action@v1
        with:
          username: SivaSabariGanesan
          token: ${{ secrets.GITHUB_TOKEN }}
          theme: dark
          background: 0D1117
          ring: 58A6FF
          fire: 58A6FF
          currStreakNum: 58A6FF
          sideNums: C9D1D9
          sideLabels: 58A6FF
          dates: 8B949E
          hide_border: true
          output-path: profile/streak.svg

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update streak stats svg"
            git push
          fi
