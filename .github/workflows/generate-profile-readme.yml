name: Generate Profile README

on:
  push:
    paths:
      - 'profile-content/**'
      - '.github/workflows/generate-profile-readme.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Render README.md
        run: node .github/scripts/render-readme.js

      - name: Commit and Push README.md if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes to README.md"
          else
            git commit -m "chore: auto-generate README.md from profile-content"
            git push
          fi
