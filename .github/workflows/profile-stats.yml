name: Profile Stats

on:
  schedule:
    - cron: "0 0 * * *" # Daily at midnight
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create profile directory
        run: mkdir -p profile

      - name: Generate GitHub Stats Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=SivaSabariGanesan&show_icons=true&include_all_commits=true&hide_border=true&bg_color=0D1117&title_color=58A6FF&icon_color=58A6FF&text_color=C9D1D9
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Top Languages Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=SivaSabariGanesan&layout=compact&langs_count=8&hide_border=true&bg_color=0D1117&title_color=58A6FF&icon_color=58A6FF&text_color=C9D1D9
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate GitHub Streak Stats
        uses: be-next/github-streak-stats-action@v1
        with:
          username: SivaSabariGanesan
          token: ${{ secrets.GITHUB_TOKEN }}
          theme: dark
          background: 0D1117
          ring: 58A6FF
          fire: 58A6FF
          currStreakNum: 58A6FF
          sideNums: C9D1D9
          sideLabels: 58A6FF
          dates: 8B949E
          hide_border: true
          output-path: profile/streak.svg

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg profile/streak.svg
          if git diff --cached --quiet; then
            echo "No changes to stats SVGs"
          else
            git commit -m "chore: update profile statistics SVGs [skip ci]"
            git push
          fi
