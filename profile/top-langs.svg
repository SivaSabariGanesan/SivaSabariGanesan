<svg width="350" height="200" viewBox="0 0 350 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="descId">
  <title id="titleId">Most Used Languages</title>
  <style>
    .header { font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #58A6FF; }
    .lang-name { font: 400 13px 'Segoe UI', Ubuntu, Sans-Serif; fill: #C9D1D9; }
    .lang-percent { font: 400 13px 'Segoe UI', Ubuntu, Sans-Serif; fill: #8B949E; }
  </style>
  <rect x="0.5" y="0.5" rx="4.5" width="349" height="199" fill="#0D1117" stroke="#30363D"/>
  <g transform="translate(25, 35)">
    <text x="0" y="0" class="header">Most Used Languages</text>
  </g>
  <!-- Multi-color Language Bar -->
  <g transform="translate(25, 55)">
    <rect x="0" y="0" width="115" height="10" fill="#3178C6" rx="3"/>
    <rect x="117" y="0" width="81" height="10" fill="#F7DF1E" rx="3"/>
    <rect x="200" y="0" width="55" height="10" fill="#3572A5" rx="3"/>
    <rect x="257" y="0" width="27" height="10" fill="#E34C26" rx="3"/>
    <rect x="286" y="0" width="14" height="10" fill="#B07219" rx="3"/>
  </g>
  <g transform="translate(25, 90)">
    <g transform="translate(0, 0)">
      <circle cx="6" cy="6" r="5" fill="#3178C6"/>
      <text x="20" y="10" class="lang-name">TypeScript</text>
      <text x="110" y="10" class="lang-percent">38.5%</text>
    </g>
    <g transform="translate(150, 0)">
      <circle cx="6" cy="6" r="5" fill="#F7DF1E"/>
      <text x="20" y="10" class="lang-name">JavaScript</text>
      <text x="110" y="10" class="lang-percent">27.2%</text>
    </g>
    <g transform="translate(0, 30)">
      <circle cx="6" cy="6" r="5" fill="#3572A5"/>
      <text x="20" y="10" class="lang-name">Python</text>
      <text x="110" y="10" class="lang-percent">18.4%</text>
    </g>
    <g transform="translate(150, 30)">
      <circle cx="6" cy="6" r="5" fill="#E34C26"/>
      <text x="20" y="10" class="lang-name">HTML/CSS</text>
      <text x="110" y="10" class="lang-percent">9.1%</text>
    </g>
    <g transform="translate(0, 60)">
      <circle cx="6" cy="6" r="5" fill="#B07219"/>
      <text x="20" y="10" class="lang-name">Java</text>
      <text x="110" y="10" class="lang-percent">6.8%</text>
    </g>
  </g>
</svg>